[project]
name = "jev-assistant"
version = "0.1.0"
description = "Local macOS assistant that uses TypeSafe Jev to decide and execute closed-set actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.5.7",
    "python-dotenv>=1.0.0",
]

[project.scripts]
jev = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
